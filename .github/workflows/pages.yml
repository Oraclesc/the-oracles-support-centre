name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    outputs:
      deployment_failed: ${{ steps.deployment.outcome == 'failure' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enrich card guides with original card-specific content
        run: node scripts/enrich-card-guides.js
      - name: Audit all 156 card guides and validate JavaScript syntax
        run: |
          for file in Js/*.js data/*.js scripts/*.js; do node --check "$file"; done
          node scripts/inline-script-audit.js
          node scripts/content-quality-audit.js

      - name: Standardise navigation and audit internal links, assets and sitemap
        run: node scripts/site-audit.js
      - name: Validate inline scripts after site-wide accessibility and consent updates
        run: node scripts/inline-script-audit.js

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true

  deploy-retry-1:
    needs: deploy
    if: always() && needs.deploy.outputs.deployment_failed == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Retry GitHub Pages deployment
        id: deployment
        uses: actions/deploy-pages@v5

  deploy-retry-2:
    needs: deploy-retry-1
    if: always() && needs.deploy-retry-1.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Final GitHub Pages deployment retry
        id: deployment
        uses: actions/deploy-pages@v5

  verify-live-site:
    needs: [deploy, deploy-retry-1, deploy-retry-2]
    if: always() && (needs.deploy.result == 'success' || needs.deploy-retry-1.result == 'success' || needs.deploy-retry-2.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site files for live URL audit
        uses: actions/checkout@v4

      - name: Audit every live sitemap URL and internal asset
        run: node scripts/live-link-audit.js

      - name: Verify live homepage, card guide and ads.txt
        shell: bash
        run: |
          set -euo pipefail
          fetch_check() {
            local url="$1" file="$2" marker="$3"
            for attempt in 1 2 3 4 5 6; do
              code=$(curl --connect-timeout 5 --max-time 15 -sSL -H 'Cache-Control: no-cache' -o "$file" -w '%{http_code}' "${url}?verify=${GITHUB_SHA}")
              if [ "$code" = "200" ] && grep -Fq "$marker" "$file"; then
                echo "PASS $url (HTTP $code)"
                return 0
              fi
              echo "Attempt $attempt: $url returned HTTP $code or expected content was not present."
              sleep 10
            done
            echo "FAIL $url did not return the expected live content."
            exit 1
          }
          fetch_check "https://oraclesupportcentre.com/ads.txt" "/tmp/ads.txt" "google.com, pub-2517381819553976, DIRECT, f08c47fec0942fa0"
          fetch_check "https://oraclesupportcentre.com/" "/tmp/home.html" "Your Daily Tarot Quest Awaits"
          fetch_check "https://oraclesupportcentre.com/queen-of-cups.html" "/tmp/queen.html" "Queen of Cups brings empathy, intuition and care into focus"
          fetch_check "https://oraclesupportcentre.com/daily-quest.html" "/tmp/quest.html" "Daily Tarot Quest"
          fetch_check "https://oraclesupportcentre.com/marseille-queen-of-cups.html" "/tmp/marseille.html" "In Marseille readings, its court role"
          fetch_check "https://oraclesupportcentre.com/tarot-school.html" "/tmp/school.html" "A Simple Weekly Study Routine"
          fetch_check "https://oraclesupportcentre.com/horoscope.html" "/tmp/horoscope.html" "Powered by FreeHoroscopeAPI"
          fetch_check "https://oraclesupportcentre.com/tools.html" "/tmp/tools.html" "Daily Horoscope"
          echo "Live homepage, Rider–Waite and Marseille guides, learning hub, horoscope attribution, Tools directory, Daily Quest and ads.txt all passed."
