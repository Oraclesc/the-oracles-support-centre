name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enrich card guides with original card-specific content
        run: node scripts/enrich-card-guides.js

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v5

  deploy-retry-1:
    needs: deploy
    if: always() && needs.deploy.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Retry GitHub Pages deployment
        id: deployment
        uses: actions/deploy-pages@v5

  deploy-retry-2:
    needs: deploy-retry-1
    if: always() && needs.deploy-retry-1.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Final GitHub Pages deployment retry
        id: deployment
        uses: actions/deploy-pages@v5

  verify-live-site:
    needs: [deploy, deploy-retry-1, deploy-retry-2]
    if: always() && (needs.deploy.result == 'success' || needs.deploy-retry-1.result == 'success' || needs.deploy-retry-2.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Verify live homepage, card guide and ads.txt
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if curl -fsSL https://oraclesupportcentre.com/ads.txt -o /tmp/ads.txt && grep -Fq "google.com, pub-2517381819553976, DIRECT, f08c47fec0942fa0" /tmp/ads.txt; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "ads.txt is not publicly reachable with the expected publisher entry."
              exit 1
            fi
            sleep 15
          done
          curl -fsSL https://oraclesupportcentre.com/ -o /tmp/home.html
          grep -Fq "Your Daily Tarot Quest Awaits" /tmp/home.html
          curl -fsSL https://oraclesupportcentre.com/queen-of-cups.html -o /tmp/queen.html
          grep -Fq "emotional receptivity with discernment" /tmp/queen.html
          curl -fsSL https://oraclesupportcentre.com/daily-quest.html -o /tmp/quest.html
          grep -Fq "Daily Quest" /tmp/quest.html
          echo "Live homepage, Queen of Cups guide, Daily Quest page and ads.txt all passed."
