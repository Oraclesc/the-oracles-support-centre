name: Generate Tarot Card Guides
on:
  push:
    branches: [main]
    paths:
      - 'data/tarot-data.js'
      - 'scripts/generate-card-guides.js'
      - 'css/tools.css'
      - 'manifest.webmanifest'
      - 'Js/tools.js'
      - '.github/workflows/generate-card-guides.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate card guide pages
        run: node scripts/generate-card-guides.js
      - name: Remove superseded large image assets
        run: rm -f images/moon.png images/card-back.png
      - name: Commit generated guides and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated guide changes."
          else
            git commit -m "Refresh card guides and optimize image assets"
            git push
          fi
