name: Add Tools navigation site-wide

on:
  push:
    paths:
      - '*.html'
      - 'scripts/add-tools-nav.js'
      - '.github/workflows/add-tools-nav.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-nav:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Add Tools navigation
        run: node scripts/add-tools-nav.js

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          if git diff --cached --quiet; then
            echo "No navigation changes needed."
          else
            git commit -m "Add Tools link to site navigation"
            git push
          fi
